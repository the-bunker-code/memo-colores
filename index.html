<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Juego de memoria con tapitas de colores para niñas y niños de 3 a 7 años: repetir colores, adivinar cuál falta y encontrar la tapita bajo el vaso."
    />
    <!--
      Política de seguridad (CSP): solo se cargan archivos de este mismo sitio y
      ningún script o estilo escrito dentro del HTML. Va aquí además de en _headers
      para que también funcione en GitHub Pages, que no permite cabeceras propias.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#ffe7b8" />
    <title>Memo Colores</title>

    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />

    <!-- Letra redondeada, servida desde este sitio: no se envía nada a terceros. -->
    <link rel="preload" href="fonts/fredoka-latin-v17.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/styles.css" />

    <!--
      modulepreload: el navegador descarga todos los módulos a la vez, en vez de
      descubrirlos de a uno (main → game → rules → config). Si agregas un módulo
      a js/, agrégalo también aquí.
    -->
    <link rel="modulepreload" href="js/main.js" />
    <link rel="modulepreload" href="js/game.js" />
    <link rel="modulepreload" href="js/render.js" />
    <link rel="modulepreload" href="js/rules.js" />
    <link rel="modulepreload" href="js/config.js" />
    <link rel="modulepreload" href="js/spanish.js" />
    <link rel="modulepreload" href="js/audio.js" />
    <link rel="modulepreload" href="js/storage.js" />
    <link rel="modulepreload" href="js/icons.js" />
    <link rel="modulepreload" href="js/mascot.js" />
    <link rel="modulepreload" href="js/settings-panel.js" />
  </head>
  <body>
    <noscript><p class="boot-warning">Este juego necesita JavaScript.</p></noscript>
    <p class="boot-warning" id="boot-warning">Cargando… si ves esto, abre con un servidor local.</p>

    <svg class="hills" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true">
      <path class="hills__back" d="M0 55 C70 15 150 25 215 50 S335 85 400 45 V120 H0Z" />
      <path d="M0 85 C70 58 150 68 210 88 S330 110 400 78 V120 H0Z" />
    </svg>

    <main class="app">
      <!-- 1. Inicio -->
      <section class="screen screen--home" id="screen-home" tabindex="-1" hidden>
        <header class="home-header">
          <h1 class="logo">Memo <span class="logo__accent">Colores</span></h1>
          <button class="gear" type="button" data-action="open-settings" aria-label="Ajustes para adultos">
            <span data-icon="settings" data-size="26"></span>
          </button>
        </header>

        <div class="greeting">
          <div class="greeting__mascot mascot is-floating" id="home-mascot"></div>
          <p class="bubble greeting__bubble">¡Hola! ¿Jugamos?</p>
        </div>

        <div class="level-picker" id="level-picker" role="group" aria-label="Nivel"></div>

        <div class="mode-grid" id="mode-grid"></div>
      </section>

      <!-- 2. Juego -->
      <section class="screen screen--game" id="screen-game" tabindex="-1" hidden>
        <h2 class="sr-only">Jugando</h2>
        <header class="topbar">
          <div class="avatar" id="avatar"></div>
          <div class="progress" id="progress" role="progressbar" aria-label="Rondas" aria-valuemin="0"></div>
          <button class="gear" type="button" data-action="open-settings" aria-label="Ajustes para adultos">
            <span data-icon="settings" data-size="26"></span>
          </button>
        </header>

        <div class="mode-chip" id="mode-chip"></div>

        <button
          class="question"
          id="question"
          type="button"
          data-action="repeat-question"
          aria-label="Repetir la pregunta"
        ></button>

        <div class="game-layout">
          <div class="game-layout__main">
            <div class="prompt-card" id="prompt-card"></div>
            <div class="table" id="table"></div>
            <!-- Lo único que se anuncia solo: una frase corta por fase, no todo el tablero. -->
            <p class="sr-only" id="status" role="status"></p>
          </div>
          <div class="game-layout__side">
            <div class="tray" id="tray"></div>
            <details class="adult">
              <summary class="adult__summary">
                <span data-icon="info" data-size="22"></span>
                <span>Para el adulto</span>
                <span class="adult__chevron" data-icon="chevron-down" data-size="22"></span>
              </summary>
              <ul class="adult__list" id="adult-tips"></ul>
            </details>
          </div>
        </div>
      </section>

      <!-- 3. Final -->
      <section class="screen screen--end" id="screen-end" tabindex="-1" hidden>
        <div class="end">
          <div class="end__mascot mascot is-floating" id="end-mascot"></div>
          <div class="end__stars" id="end-stars"></div>
          <h2 class="end__title">Terminamos</h2>
          <p class="end__line"><span data-icon="package" data-size="26"></span> Ahora guardamos juntos</p>
          <div class="end__buttons" id="end-buttons">
            <button class="chunky end__button" type="button" data-action="go-home">
              <span data-icon="house" data-size="26"></span> Inicio
            </button>
            <button class="chunky chunky--blue end__button" type="button" data-action="play-again">
              <span data-icon="rotate-ccw" data-size="26"></span> Otra vez
            </button>
          </div>
        </div>
      </section>
    </main>

    <!-- Panel del adulto. settings-panel.js lo llena y lo maneja. -->
    <dialog class="settings" id="settings" aria-labelledby="settings-title">
      <form class="settings__form" method="dialog" id="settings-form">
        <h2 class="settings__title" id="settings-title">Ajustes para adultos</h2>
        <div id="settings-fields"></div>
        <div class="settings__actions">
          <button class="settings__button" type="button" data-settings="home">Inicio</button>
          <button class="settings__button" type="button" data-settings="cancel">Cancelar</button>
          <button class="settings__button settings__button--primary" type="submit" data-settings="save">
            Guardar y empezar
          </button>
        </div>
      </form>
    </dialog>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
